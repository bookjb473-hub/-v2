name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Auto Generate Complete Project
        run: |
          flutter create --platforms=android --org com.project --project-name egg_pam_controller .
          
          # ระบบเซิร์ฟเวอร์จะทำการเขียนไฟล์ pubspec.yaml ให้เองโดยอัตโนมัติ แถวตรงเป๊ะ 100%
          echo 'name: egg_pam_controller' > pubspec.yaml
          echo 'description: "Egg Pam project"' >> pubspec.yaml
          echo 'publish_to: "none"' >> pubspec.yaml
          echo 'version: 1.0.0+1' >> pubspec.yaml
          echo 'environment:' >> pubspec.yaml
          echo '  sdk: ">=3.0.0 <4.0.0"' >> pubspec.yaml
          echo 'dependencies:' >> pubspec.yaml
          echo '  flutter:' >> pubspec.yaml
          echo '    sdk: flutter' >> pubspec.yaml
          echo '  flutter_blue_plus: ^1.31.0' >> pubspec.yaml
          echo 'dev_dependencies:' >> pubspec.yaml
          echo '  flutter_test:' >> pubspec.yaml
          echo '    sdk: flutter' >> pubspec.yaml
          echo '  flutter_lints: ^3.0.0' >> pubspec.yaml
          echo 'flutter:' >> pubspec.yaml
          echo '  uses-material-design: true' >> pubspec.yaml

          # ระบบเซิร์ฟเวอร์จะเขียนไฟล์ lib/main.dart ให้เองโดยตรง ไม่ต้องก๊อปปี้วางบนมือถือ
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter_blue_plus/flutter_blue_plus.dart';
          void main() => runApp(const MaterialApp(home: ControllerPage()));
          class ControllerPage extends StatefulWidget {
            const ControllerPage({super.key});
            @override
            State<ControllerPage> createState() => _ControllerPageState();
          }
          class _ControllerPageState extends State<ControllerPage> {
            String currentStatus = "เปิดบลูทูธบนมือถือเพื่อเตรียมเชื่อมต่อ";
            BluetoothDevice? targetDevice;
            BluetoothCharacteristic? writeCharacteristic;
            bool isConnecting = false;
            final String serviceUuid = "6E400001-B5A3-F393-E0A9-E50E24DCCA9E";
            final String characteristicUuidRx = "6E400002-B5A3-F393-E0A9-E50E24DCCA9E";
            @override
            void initState() {
              super.initState();
              FlutterBluePlus.adapterState.listen((state) {
                if (state == BluetoothAdapterState.on) {
                  setState(() { currentStatus = "บลูทูธพร้อมทำงาน กดค้นหาเครื่องได้เลย"; });
                } else {
                  setState(() { currentStatus = "⚠️ กรุณาเปิดระบบบลูทูธบนโทรศัพท์มือถือ"; });
                }
              });
            }
            void startScanAndConnect() async {
              if (await FlutterBluePlus.isSupported == false) return;
              setState(() { isConnecting = true; currentStatus = "กำลังค้นหาเครื่องเก็บไข่ผำ (ESP32)..."; });
              await FlutterBluePlus.startScan(timeout: const Duration(seconds: 5));
              FlutterBluePlus.scanResults.listen((results) async {
                for (ScanResult r in results) {
                  if (r.device.platformName == "ESP32" || r.device.advName == "ESP32") {
                    await FlutterBluePlus.stopScan();
                    try {
                      await r.device.connect();
                      targetDevice = r.device;
                      List<BluetoothService> services = await r.device.discoverServices();
                      for (BluetoothService service in services) {
                        if (service.uuid.toString().toUpperCase() == serviceUuid) {
                          for (BluetoothCharacteristic characteristic in service.characteristics) {
                            if (characteristic.uuid.toString().toUpperCase() == characteristicUuidRx) {
                              writeCharacteristic = characteristic;
                              break;
                            }
                          }
                        }
                      }
                      setState(() { isConnecting = false; currentStatus = "เชื่อมต่อระบบสำเร็จเรียบร้อย!"; });
                    } catch (e) {
                      setState(() { isConnecting = false; currentStatus = "เชื่อมต่อล้มเหลว"; });
                    }
                    break;
                  }
                }
              });
            }
            void sendCommand(String command, String actionName) async {
              if (writeCharacteristic != null) {
                await writeCharacteristic!.write(command.codeUnits, withoutResponse: true);
                setState(() { currentStatus = "กำลังควบคุม: $actionName ($command)"; });
              } else {
                setState(() { currentStatus = "⚠️ กรุณาเชื่อมต่อบลูทูธก่อนสั่งงาน"; });
              }
            }
            @override
            Widget build(BuildContext context) {
              bool isConnected = targetDevice != null && writeCharacteristic != null;
              return Scaffold(
                appBar: AppBar(
                  title: const Column(
                    children: [
                      Text('เครื่องเก็บไข่ผำ', style: TextStyle(fontSize: 19, fontWeight: FontWeight.bold, color: Colors.white)),
                      Text('มหาวิทยาลัยราชภัฏพิบูลสงคราม พิษณุโลก', style: TextStyle(fontSize: 11, color: Colors.white70)),
                    ],
                  ),
                  centerTitle: true,
                  backgroundColor: const Color(0xFF007A33),
                ),
                body: SingleChildScrollView(
                  child: Padding(
                    padding: const EdgeInsets.all(20.0),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        Container(
                          height: 12,
                          decoration: BoxDecoration(
                            borderRadius: BorderRadius.circular(10),
                            gradient: const LinearGradient(colors: [Colors.red, Colors.orange, Colors.yellow, Colors.green, Colors.blue, Colors.purple, Colors.red]),
                          ),
                        ),
                        const SizedBox(height: 15),
                        Card(
                          child: Padding(
                            padding: const EdgeInsets.all(16.0),
                            child: Column(
                              children: [
                                const Text("เครื่องเก็บไข่ผำ", style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Color(0xFF007A33))),
                                const Divider(),
                                ElevatedButton.icon(
                                  onPressed: (isConnecting || isConnected) ? null : startScanAndConnect,
                                  icon: Icon(isConnected ? Icons.bluetooth_connected : Icons.bluetooth_searching),
                                  label: Text(isConnected ? 'เชื่อมต่อสำเร็จแล้ว' : 'กดเพื่อเชื่อมต่อบลูทูธ'),
                                  style: ElevatedButton.styleFrom(backgroundColor: isConnected ? Colors.blue : const Color(0xFF333333), foregroundColor: Colors.white),
                                ),
                                const SizedBox(height: 12),
                                Text(currentStatus, style: TextStyle(color: isConnected ? Colors.green : Colors.red, fontWeight: FontWeight.bold), textAlign: TextAlign.center),
                              ],
                            ),
                          ),
                        ),
                        const SizedBox(height: 15),
                        Card(
                          child: Padding(
                            padding: const EdgeInsets.symmetric(vertical: 30.0),
                            child: Column(
                              children: [
                                InkWell(onTap: () => sendCommand("F", "เดินหน้า"), child: const Icon(Icons.arrow_circle_up_rounded, size: 85, color: Color(0xFF007A33))),
                                Row(
                                  mainAxisAlignment: MainAxisAlignment.center,
                                  children: [
                                    InkWell(onTap: () => sendCommand("L", "เลี้ยวซ้าย"), child: const Icon(Icons.arrow_circle_left_rounded, size: 85, color: Color(0xFF007A33))),
                                    const SizedBox(width: 45),
                                    InkWell(onTap: () => sendCommand("R", "เลี้ยวขวา"), child: const Icon(Icons.arrow_circle_right_rounded, size: 85, color: Color(0xFF007A33))),
                                  ],
                                ),
                                InkWell(onTap: () => sendCommand("B", "ถอยหลัง"), child: const Icon(Icons.arrow_circle_down_rounded, size: 85, color: Color(0xFF007A33))),
                                const SizedBox(height: 25),
                                ElevatedButton.icon(
                                  onPressed: () => sendCommand("S", "หยุดทำงาน"),
                                  icon: const Icon(Icons.dangerous),
                                  label: const Text('หยุดเครื่อง (STOP)'),
                                  style: ElevatedButton.styleFrom(backgroundColor: Colors.red, foregroundColor: Colors.white, minimumSize: const Size.fromHeight(50)),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ],
                    ),
